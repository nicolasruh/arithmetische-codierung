<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arithmetische Codierung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="title">Arithmetische Codierung</h1>
    <label class="lang"><span data-i18n="language">Sprache</span>
      <select id="lang"><option value="de">Deutsch</option><option value="en">English</option></select>
    </label>
  </header>

  <main>
    <section class="panel row">
      <label class="grow"><span data-i18n="textLabel">Nachricht:</span>
        <textarea id="text" rows="1" wrap="off" autocomplete="off" spellcheck="false" data-i18n-placeholder="textPlaceholder">ABRAKADABRA</textarea>
      </label>
      <label class="examples"><span data-i18n="examples">Beispiele:</span>
        <select id="examples" autocomplete="off"></select>
      </label>
      <fieldset>
        <legend data-i18n="modeLabel">Modus:</legend>
        <label><input type="radio" name="mode" value="build" checked autocomplete="off"> <span data-i18n="modeBuild">Selbst decodieren</span></label>
        <label><input type="radio" name="mode" value="show" autocomplete="off"> <span data-i18n="modeShow">Anzeigen</span></label>
      </fieldset>
    </section>

    <section id="task" class="panel two">
      <div>
        <h2 data-i18n="taskTitle">Aufgabe</h2>
        <div id="model"></div>
      </div>
      <div class="taskinfo">
        <div class="big"><span data-i18n="numberLabel">Nachricht</span> = <span id="number" class="mono"></span> <span id="length" class="mono"></span></div>
        <div id="precision"></div>
        <p class="note" data-i18n="rangeNote"></p>
        <p class="note" id="roundNote" data-i18n="roundNote" hidden></p>
      </div>
    </section>

    <section class="panel">
      <div class="buttons">
        <button id="prev" data-i18n="prev">Zurück</button>
        <button id="next" data-i18n="next">Weiter</button>
        <button id="all" data-i18n="all">Ganzen Ablauf zeigen</button>
        <button id="undo" data-i18n="undo">Rückgängig</button>
        <button id="auto" data-i18n="auto">Automatisch vervollständigen</button>
        <button id="reset" data-i18n="reset">Neu beginnen</button>
      </div>
      <p id="message" class="message" role="status"></p>
      <div id="decoded" class="decoded"></div>
      <div id="strips" class="strips"></div>
    </section>

    <section id="encPanel" class="panel">
      <div class="head">
        <h2 data-i18n="encTitle">Codierung</h2>
        <label class="sub"><input type="checkbox" id="showEnc" autocomplete="off"> <span data-i18n="encShow">Codierung anzeigen</span></label>
      </div>
      <div id="encBox" hidden>
        <p class="note" data-i18n="encHint"></p>
        <div id="encTable" class="scroll"></div>
        <p id="encFinal" class="mono"></p>
        <p id="encNumber" class="mono"></p>
      </div>
    </section>
  </main>

  <script src="js/arith.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
